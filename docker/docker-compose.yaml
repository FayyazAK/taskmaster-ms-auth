services:
  auth-db:
    image: mysql:8
    container_name: taskmaster_auth_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: taskmaster_auth_db
    ports:
      - "3301:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - backend_network

  auth-service:
      build:
        context: ..
        dockerfile: docker/Dockerfile
      container_name: taskmaster_auth
      ports:
        - "4001:4001"
      depends_on:
        - auth-db
      env_file:
        - ../.env
      volumes:
        - ../src:/app/src
        - ../package.json:/app/package.json
        - ../package-lock.json:/app/package-lock.json
      networks:
        - backend_network

volumes:
  auth-db-data:

networks:
  backend_network:
    external: true